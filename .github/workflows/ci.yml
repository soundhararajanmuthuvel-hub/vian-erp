name: VIAN ERP CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI (Node.js & Express)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Verify Backend Syntax & Run Tests
        run: |
          cd backend
          node --check server.js
          node --check routes.js
          node test_backend.js

  frontend-ci:
    name: Frontend CI (Flutter Web & Mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Install Web Dependencies
        run: |
          cd apps/flutter_web
          flutter pub get

      - name: Static Code Analysis (Web)
        run: |
          cd apps/flutter_web
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Web Unit & Widget Tests
        run: |
          cd apps/flutter_web
          flutter test

      - name: Run Flutter Web Production Build
        run: |
          cd apps/flutter_web
          flutter build web --release --dart-define=API_URL=https://vian-erp-api.onrender.com/api --dart-define=ENABLE_DEMO_LOGIN=false --dart-define=ENVIRONMENT=production

      - name: Install Mobile Dependencies
        run: |
          cd apps/flutter_mobile
          flutter pub get

      - name: Static Code Analysis (Mobile)
        run: |
          cd apps/flutter_mobile
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Mobile Unit Tests
        run: |
          cd apps/flutter_mobile
          flutter test
