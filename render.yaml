databases:
  - name: vian-erp-db
    databaseName: vian_erp_db
    user: vian_admin
    region: singapore
    plan: starter

services:
  - type: web
    name: vian-erp-api
    env: node
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: vian-erp-db
          property: connectionString
      # Production secrets to configure in Render Dashboard:
      # - JWT_SECRET
      # - CORS_ORIGINS (e.g. https://your-project.vercel.app)
      # - CLOUDINARY_CLOUD_NAME
      # - CLOUDINARY_API_KEY
      # - CLOUDINARY_API_SECRET
      # - GEMINI_API_KEY
